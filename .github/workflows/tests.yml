name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: ci4_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - uses: actions/checkout@v3

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, mysqli, gd, curl, zip, fileinfo, json, session, tokenizer

    - name: Get composer cache directory
      id: composer-cache
      run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

    - name: Cache composer dependencies
      uses: actions/cache@v3
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: ${{ runner.os }}-composer-

    - name: Install dependencies
      run: |
        cd src
        composer install --prefer-dist --no-progress --no-suggest

    - name: Run PHP CS Fixer
      run: |
        cd src
        ./vendor/bin/php-cs-fixer fix --dry-run --diff

    - name: Run PHPStan
      run: |
        cd src
        ./vendor/bin/phpstan analyse app/ --level=5

    - name: Run tests
      run: |
        cd src
        ./vendor/bin/phpunit tests/unit/ tests/Feature/ --exclude-group database

    - name: Run tests with coverage
      run: |
        cd src
        ./vendor/bin/phpunit tests/unit/ tests/Feature/ --coverage-text --exclude-group database

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: src/coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
