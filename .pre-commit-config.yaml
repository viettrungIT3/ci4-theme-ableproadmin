repos:
  - repo: local
    hooks:
      - id: php-cs-fixer
        name: PHP CS Fixer
        entry: docker compose --env-file .env exec codeigniter4-services ./vendor/bin/php-cs-fixer fix --dry-run --diff
        language: system
        files: \.php$
        pass_filenames: false
        
      - id: phpstan
        name: PHPStan
        entry: docker compose --env-file .env exec codeigniter4-services ./vendor/bin/phpstan analyse
        language: system
        files: \.php$
        pass_filenames: false
        
      - id: phpunit
        name: PHPUnit Tests
        entry: docker compose --env-file .env exec codeigniter4-services ./vendor/bin/phpunit
        language: system
        pass_filenames: false
